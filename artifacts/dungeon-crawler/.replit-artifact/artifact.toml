kind = "web"
previewPath = "/"
title = "Dungeon Crawler"
version = "1.0.0"
id = "artifacts/dungeon-crawler"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21601

[services.development]
run = "pnpm --filter @workspace/dungeon-crawler run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dungeon-crawler", "run", "build" ]
serve = "static"
publicDir = "artifacts/dungeon-crawler/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21601"
BASE_PATH = "/"
